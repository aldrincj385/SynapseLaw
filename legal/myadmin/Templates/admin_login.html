<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
    margin: 0;
    padding: 0;
    background-color:#006b1b;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 380px;
    margin: 80px auto;
    background-color: #ffffff;
    padding: 25px 30px;
    border-radius: 6px;
    border: 1px solid #ddd;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #444;
}

input {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #2c6ed5;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background-color: #245bb5;
}
.login-text {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.login-text a {
    color: #2c6ed5;
    text-decoration: none;
}

.login-text a:hover {
    text-decoration: underline;
}
 /* Alerts */
.alert {
    padding: 12px 18px;
    margin: 10px 0;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    animation: fadeIn 0.3s ease-in-out;
}
.alert-success { background-color: #28a745; }
.alert-error { background-color: #dc3545; }
.alert-warning { background-color: #ffc107; color: #000; }
.alert-info { background-color: #17a2b8; }
.mt-2 { margin-top: 8px; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>
</head>
<body>
<div class="container">
<h1>WELCOME</h1>
 <div class="btn-group">
        <a href="{% url 'main_home' %}">
            <button>Log Out</button>
        </a>
    </div>
</div>
</body>
</html>
